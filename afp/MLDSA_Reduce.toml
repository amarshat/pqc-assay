title = "The Modular-Reduction Layer of ML-DSA"
date = 2026-08-23
topics = [
  "Computer science/Security/Cryptography",
  "Computer science/Algorithms/Mathematical",
]
abstract = """
FIPS 204 fixes the prime modulus q = 8380417 for ML-DSA. Deployed implementations
reduce values modulo q with a small layer of routines that the standard does not
itself spell out: Montgomery reduction, a Barrett-style reduce32, a conditional
addition, and their composition. This entry specifies what each routine must
satisfy at the integer level, defines the fixed-width implementations used by the
reference implementation, and proves that the implementations meet the
specifications.

The arithmetic core is that if T is congruent to A * QINV modulo 2^32 and lies in
the signed 32-bit range, then (A - T*q) / 2^32 is congruent to A * 2^-32 modulo q
and lies strictly between -q and q. Two specifications depart deliberately from the
bounds documented in the reference implementation, because those bounds are off by
one at an endpoint: Montgomery reduction is specified on a half-open input domain,
since the inclusive upper endpoint returns exactly q and so violates the documented
strict bound, and reduce32 is specified on its true reachable output window, which
is asymmetric. Both departures are noted where they occur."""
