name: Deploy docs to Pages

# The default "Deploy from a branch" Pages build checks out submodules recursively, which fails
# because paper/ is a private submodule the Pages runner cannot clone. This custom workflow checks
# out without submodules and publishes docs/ as the Pages site.

on:
  push:
    branches: [main]
    paths: ['docs/**']   # only redeploy when the published content changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let an in-flight deploy finish rather than cancelling it. Cancelling a deploy mid-flight can leave
  # the Pages deployment stuck and make the next run fail with "Deployment failed, try again later".
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
