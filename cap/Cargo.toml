[package]
name = "cap-v1"
version = "0.1.0"
edition = "2021"
description = "Cap-V1: fixed-format post-quantum agent-delegation capability token, with a Kani-verified verifier"
license = "MIT"

[lib]
name = "cap_v1"
path = "src/lib.rs"

# No default dependencies on purpose. The trusted parse/serialize path is pure byte layout, so the
# Kani-verified core pulls in no unverified third-party code. sha2 is optional and only compiles
# under the `hyb1-keyid` feature (deployment key commitment); it does not enter any Kani harness.
[dependencies]
sha2 = { version = "0.10", optional = true }

[features]
# HYB-1 deployment key_id: `hyb1::hyb1_key_id` = truncated SHA-256 over the encoded hybrid public
# key. Off by default so `cargo kani` and plain builds stay dependency-free.
hyb1-keyid = ["dep:sha2"]

# `kani` cfg is set by cargo-kani, not by a Cargo feature; declare it so plain builds don't warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# Dev-only: the integration test runs real hybrid crypto over serialize(cap). These do NOT enter the
# Kani-verified path (which is the lib's #[cfg(kani)] harnesses over pure byte layout).
[dev-dependencies]
# ML-DSA-44 from the RustCrypto crate this project also formally verifies.
ml-dsa = "0.1.1"
# Classical half of the hybrid.
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# The hybrid test computes the real key commitment through the library's `hyb1-keyid` feature, so
# it only builds (and runs) with that feature on: `cargo test --features hyb1-keyid`, or the
# `make cap-hybrid` target. A plain `cargo test` skips it silently; use the make target.
[[test]]
name = "hybrid"
required-features = ["hyb1-keyid"]
